name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    # Not `steps.signing.outputs.enabled` -- that is only the intent to sign,
    # read off whether the secrets exist. What the release notes have to state
    # is what the bundle actually carries, which is only known once the
    # certificate is in a keychain and `find-identity` has named it.
    outputs:
      signed: ${{ steps.certificate.outputs.identity != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Determine macOS signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          # A pre-release tag -- anything carrying a hyphen, v2.9.0-rc.1 --
          # takes the ad-hoc path deliberately. Notarization is the slowest
          # and least predictable step in this workflow: submissions have
          # been accepted in minutes and have also sat in Apple's queue for
          # more than a day, and the run that exceeded 1h50m failed on the
          # runner's own network rather than on anything Apple said. A
          # pre-release is never served by the updater, which only reads
          # `releases/latest`, so waiting on that queue buys a pre-release
          # nothing at all.
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = "true" ]; then
            echo "pre-release tag: skipping Developer ID signing and notarization"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # `continue-on-error` on purpose: a certificate the runner cannot import
      # must cost the release its Developer ID signature, not its macOS
      # installer. Without it the job dies here and the release ships with no
      # macOS asset at all -- which is what happened to v2.11.0 and v2.11.1.
      # The ad-hoc build below picks up whatever this step drops.
      - name: Import Apple Developer Certificate
        id: import
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          # Straight from the secret into the keychain, with no OpenSSL in
          # between. `security` is Apple's own tool reading Apple's own
          # container format, so the RC2-40-CBC wrapper Keychain puts on an
          # exported .p12 is never a question for it. The round-trip that used
          # to sit here (p12 -> pem -> re-exported p12) was added alongside the
          # `echo` -> `printf` fix in bf5d355 and was never the half that
          # mattered -- unquoted `echo` was mangling the base64. What it did
          # earn us was a dependency on OpenSSL's default provider still
          # carrying RC2, which macos-latest dropped, taking two releases'
          # macOS installers with it.
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # Also non-fatal, and for the same reason: an identity that imported but
      # is not a Developer ID Application certificate leaves `identity` empty,
      # and empty is what routes the build to the ad-hoc path below.
      - name: Verify Certificate
        id: certificate
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "identity=$CERT_ID" >> "$GITHUB_OUTPUT"
          echo "Certificate: $CERT_ID"

      - name: Build signed Tauri app
        id: build-signed
        if: steps.certificate.outputs.identity != ''
        uses: tauri-apps/tauri-action@v0
        env:
          LANTERN_BUILD_COMMIT: ${{ github.sha }}
          LANTERN_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          LANTERN_BUILD_CHANNEL: stable
          LANTERN_UPSTREAM_BASELINE: "1.2.10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lantern ${{ github.ref_name }}"
          releaseBody: |
            [简体中文](#chinese) · [English](#english)

            <a id="chinese"></a>
            ## 中文

            Lantern ${{ github.ref_name }} 的安装包已准备完成。

            - macOS：仅支持 Apple Silicon（M 系列）Mac，要求 macOS 12 Monterey 或更高版本。
            - Windows：提供 Windows 11 x64 安装包。

            [查看此版本的提交记录](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})

            <a id="english"></a>
            ## English

            The Lantern ${{ github.ref_name }} installers are ready.

            - macOS: Apple Silicon (M-series) Macs only, running macOS 12 Monterey or later.
            - Windows: Windows 11 x64 installer available.

            [View commits in this release](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: >-
            --target aarch64-apple-darwin
            --features ocr-pipeline
            --config '{"bundle":{"macOS":{"signingIdentity":"${{ steps.certificate.outputs.identity }}","entitlements":null}}}'

      - name: Build ad-hoc signed Tauri app
        id: build-adhoc
        if: steps.certificate.outputs.identity == ''
        uses: tauri-apps/tauri-action@v0
        env:
          LANTERN_BUILD_COMMIT: ${{ github.sha }}
          LANTERN_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          LANTERN_BUILD_CHANNEL: stable
          LANTERN_UPSTREAM_BASELINE: "1.2.10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lantern ${{ github.ref_name }}"
          releaseBody: |
            [简体中文](#chinese) · [English](#english)

            <a id="chinese"></a>
            ## 中文

            Lantern ${{ github.ref_name }} 的安装包已准备完成。

            - macOS：仅支持 Apple Silicon（M 系列）Mac，要求 macOS 12 Monterey 或更高版本。
            - Windows：提供 Windows 11 x64 安装包。

            [查看此版本的提交记录](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})

            <a id="english"></a>
            ## English

            The Lantern ${{ github.ref_name }} installers are ready.

            - macOS: Apple Silicon (M-series) Macs only, running macOS 12 Monterey or later.
            - Windows: Windows 11 x64 installer available.

            [View commits in this release](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target aarch64-apple-darwin --features ocr-pipeline

      - name: Verify macOS app signature
        if: >-
          success() &&
          (steps.build-signed.outcome == 'success' || steps.build-adhoc.outcome == 'success')
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Lantern.app"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          test -d "$APP_PATH"
          test -f "$INFO_PLIST"
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")
          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          PDFIUM_DYLIB="$APP_PATH/Contents/Frameworks/libpdfium.dylib"
          test -x "$APP_EXECUTABLE"
          test -f "$PDFIUM_DYLIB"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign --verify --strict --verbose=4 "$PDFIUM_DYLIB"

          ENTITLEMENTS=$(mktemp)
          codesign -d --entitlements "$ENTITLEMENTS" --xml "$APP_EXECUTABLE"
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APP_TEAM=$(codesign -dv --verbose=4 "$APP_EXECUTABLE" 2>&1 | awk -F= '$1 == "TeamIdentifier" { print $2 }')
            PDFIUM_TEAM=$(codesign -dv --verbose=4 "$PDFIUM_DYLIB" 2>&1 | awk -F= '$1 == "TeamIdentifier" { print $2 }')
            test -n "$APP_TEAM"
            test "$APP_TEAM" != "not set"
            test "$APP_TEAM" = "$PDFIUM_TEAM"
            if /usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" "$ENTITLEMENTS" 2>/dev/null; then
              echo "Developer ID build must keep library validation enabled" >&2
              exit 1
            fi
          else
            test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" "$ENTITLEMENTS")" = "true"
          fi

          "$APP_EXECUTABLE" pdfium-smoke

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          LANTERN_BUILD_COMMIT: ${{ github.sha }}
          LANTERN_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
          LANTERN_BUILD_CHANNEL: stable
          LANTERN_UPSTREAM_BASELINE: "1.2.10"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Lantern ${{ github.ref_name }}"
          releaseBody: |
            [简体中文](#chinese) · [English](#english)

            <a id="chinese"></a>
            ## 中文

            Lantern ${{ github.ref_name }} 的安装包已准备完成。

            - macOS：仅支持 Apple Silicon（M 系列）Mac，要求 macOS 12 Monterey 或更高版本。
            - Windows：提供 Windows 11 x64 安装包。

            [查看此版本的提交记录](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})

            <a id="english"></a>
            ## English

            The Lantern ${{ github.ref_name }} installers are ready.

            - macOS: Apple Silicon (M-series) Macs only, running macOS 12 Monterey or later.
            - Windows: Windows 11 x64 installer available.

            [View commits in this release](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --features ocr-pipeline

  # Both build jobs write release notes into the same release, so whichever
  # finishes last wins -- and the Windows job cannot know how macOS was
  # signed. That is how the v2.9.0 draft ended up claiming "signed with a
  # Developer ID certificate and notarized by Apple" while carrying no macOS
  # asset at all, because the macOS job had failed. The bodies above are now
  # deliberately silent about signing, and this job is the only thing that
  # speaks about it -- after both builds have reported what actually happened.
  #
  # It runs even when a build failed, because an incomplete release still
  # needs notes that say so. If this job itself fails, the release keeps the
  # neutral body: less information, never a false claim.
  release-notes:
    needs: [build-macos, build-windows]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Write the signing and completeness notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          MACOS_SIGNED: ${{ needs.build-macos.outputs.signed }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail

          zh_mac=""
          en_mac=""
          if [ "$MACOS_RESULT" != "success" ]; then
            zh_mac="- 这个版本没有 macOS 安装包：macOS 构建未成功。"
            en_mac="- This release has no macOS installer: the macOS build did not succeed."
          elif [ "$MACOS_SIGNED" = "true" ]; then
            zh_mac="- macOS 安装包已使用 Developer ID 证书签名并通过 Apple 公证，下载后可直接打开。"
            en_mac="- The macOS installer is signed with a Developer ID certificate and notarized by Apple, so it opens without a Gatekeeper prompt."
          else
            zh_mac="- 这个 macOS 安装包只有临时签名、未经 Apple 公证，首次打开时 Gatekeeper 会要求确认。"
            en_mac="- This macOS installer carries an ad-hoc signature and was not notarized, so Gatekeeper will ask for confirmation on first launch."
          fi

          zh_win=""
          en_win=""
          if [ "$WINDOWS_RESULT" != "success" ]; then
            zh_win="- 这个版本没有 Windows 安装包：Windows 构建未成功。"
            en_win="- This release has no Windows installer: the Windows build did not succeed."
          fi

          zh_pre=""
          en_pre=""
          if [ "$PRERELEASE" = "true" ]; then
            zh_pre="这是一个预发布版本，只供测试。应用内的更新提示不会推送它——更新检查只读取正式发布。"
            en_pre="This is a pre-release, published for testing only. The in-app updater will not offer it: update checks read the latest stable release."
          fi

          {
            printf '[简体中文](#chinese) · [English](#english)\n\n'
            printf '<a id="chinese"></a>\n## 中文\n\n'
            if [ -n "$zh_pre" ]; then printf '%s\n\n' "$zh_pre"; fi
            printf 'Lantern %s 的安装包已准备完成。\n\n' "$TAG"
            if [ "$MACOS_RESULT" = "success" ]; then
              printf -- '- macOS：仅支持 Apple Silicon（M 系列）Mac，要求 macOS 12 Monterey 或更高版本。\n'
            fi
            if [ "$WINDOWS_RESULT" = "success" ]; then
              printf -- '- Windows：提供 Windows 11 x64 安装包。\n'
            fi
            printf '%s\n' "$zh_mac"
            if [ -n "$zh_win" ]; then printf '%s\n' "$zh_win"; fi
            printf '\n[查看此版本的提交记录](https://github.com/%s/commits/%s)\n\n' "$GH_REPO" "$TAG"
            printf '<a id="english"></a>\n## English\n\n'
            if [ -n "$en_pre" ]; then printf '%s\n\n' "$en_pre"; fi
            printf 'The Lantern %s installers are ready.\n\n' "$TAG"
            if [ "$MACOS_RESULT" = "success" ]; then
              printf -- '- macOS: Apple Silicon (M-series) Macs only, running macOS 12 Monterey or later.\n'
            fi
            if [ "$WINDOWS_RESULT" = "success" ]; then
              printf -- '- Windows: Windows 11 x64 installer available.\n'
            fi
            printf '%s\n' "$en_mac"
            if [ -n "$en_win" ]; then printf '%s\n' "$en_win"; fi
            printf '\n[View commits in this release](https://github.com/%s/commits/%s)\n' "$GH_REPO" "$TAG"
          } > notes.md

          cat notes.md
          gh release edit "$TAG" --notes-file notes.md
