name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - name: Build and check Reader Safari 15 compatibility
        run: npm run build
      - name: Upload Reader compatibility size report
        uses: actions/upload-artifact@v4
        with:
          name: reader-compat-size-report
          path: dist/reader-compat-size-report.json

  smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Boots the frontend in headless Chrome against the mocked Tauri backend
      # and clicks every safe control on every route, once per layout — the
      # narrow side of the `md:` breakpoint is a different application, not a
      # reflow. Google Chrome is preinstalled on the runner image, so nothing
      # is downloaded here.
      #
      # Its own job rather than a step on `frontend`: it runs in parallel with
      # the typecheck/lint/build chain instead of behind it, and a red X here
      # names the failure without anyone opening the log.
      - name: Sweep every route for runtime errors
        run: npm run smoke:ci
        timeout-minutes: 12
      # The reports distinguish app faults from harness gaps (an unstubbed
      # command answered with `{}` looks exactly like a bug). Keep them on
      # failures so that call can be made without reproducing locally. Both
      # layouts are uploaded: the one that passed is the useful comparison.
      - name: Upload smoke reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: dist/smoke-report-*.json
          if-no-files-found: warn

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-doc-links.mjs

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri 2 on Linux needs webkit2gtk and friends even for `cargo check`
      # because tauri-runtime-wry links against them. cache-apt-pkgs-action
      # caches the *installed filesystem* (not just the .debs), so a cache
      # hit untars in ~3s.
      #
      # Raw `apt-get install` takes 5+ min on a cold runner because Azure's
      # Ubuntu mirror serves the 100+ transitive deps slowly with occasional
      # 60s `Ign:` retries — that was the previous behavior here, and it
      # consistently hit the 5-min wall on backend CI.
      #
      # `timeout-minutes` bounds the cold path so a stalled install fails
      # fast instead of hanging the job; rerun to retry. Bump `version`
      # when the package list changes to invalidate the cache.
      - name: Install system dependencies (cached)
        # Pinned to v1.6.0 (2025-10-15) — `@v1` moves to v1.5.3 which has
        # had cache-restore flakes; v1.6.0 picks up the "ls error when no
        # tar files exist in cache restore" fix plus a few other patches.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        timeout-minutes: 5
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0
      - run: cargo clippy -- -D warnings
      - run: cargo check
      - run: cargo test --lib
