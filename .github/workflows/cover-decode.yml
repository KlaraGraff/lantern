name: Cover decoding

# HEIC covers decode through a different path on each platform
# (commands/books/mutate.rs): ImageIO on macOS and iOS, the bundled `heifer`
# decoder everywhere else. The Backend job in ci.yaml only ever exercises the
# Linux half, so this runs the cover tests on the two platforms users actually
# have — macOS for the system decoder, Windows for the bundled one — whenever
# that code, its fixture or its dependencies change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cover-decode.yml
      - .github/windows-test.manifest
      - src-tauri/src/commands/books/mutate.rs
      - src-tauri/tests/fixtures/cover-rotated.heic
      - src-tauri/tests/fixtures/covers/**
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock

permissions:
  contents: read

concurrency:
  group: cover-decode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cover-tests:
    name: Cover tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - if: runner.os != 'Windows'
        run: cargo test --lib commands::books::mutate::cover_tests
      # The lib's test binary imports Common Controls v6 entry points through
      # Tauri, which Windows only resolves for an executable that carries a
      # manifest asking for them. tauri-build embeds one in the app binary
      # alone, so without this the binary dies on load with
      # STATUS_ENTRYPOINT_NOT_FOUND before any test runs. The app build is
      # left as it is; only this test binary gets Tauri's default manifest.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = cargo test --lib --no-run --message-format=json |
            ForEach-Object { $_ | ConvertFrom-Json } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.executable -and $_.profile.test } |
            Select-Object -Last 1 -ExpandProperty executable
          if (-not $exe) { throw 'no lib test binary was built' }
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $mt) { throw 'mt.exe not found' }
          & $mt -nologo -manifest ..\.github\windows-test.manifest "-outputresource:$exe;#1"
          if ($LASTEXITCODE -ne 0) { throw "mt.exe failed ($LASTEXITCODE)" }
          & $exe commands::books::mutate::cover_tests
          if ($LASTEXITCODE -ne 0) { throw "cover tests failed ($LASTEXITCODE)" }
