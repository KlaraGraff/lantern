[package]
name = "lantern"
version = "2.13.1"
description = "A personalized English learning ebook reader"
authors = ["KlaraGraff"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Phase D compiles the local OCR data/job pipeline behind an opt-in flag. The
# default release remains fail-closed until the backend and Reader integration
# pass the Phase C gates.
ocr-pipeline = []

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# 2.11 is the floor for mobile: in 2.10.3 the webview commands the frontend
# relies on (`create_webview_window`, `get_all_webviews`) sit inside a
# `#[cfg(desktop)] mod desktop_commands`, so the capability ACL — which is
# resolved at compile time against the target's command set — cannot be
# satisfied for an android/ios target. 2.11.0 hoisted them out.
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-dialog = "=2.6.0"
tauri-plugin-fs = "=2.4.5"
# The frontend capability layer (`src/services/platform.ts`) reads the target
# triple through this plugin rather than sniffing the user agent, because
# iPadOS reports "Macintosh" in its webview UA and would otherwise be served
# the desktop capability set.
tauri-plugin-os = "=2.3.2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sqlite-vec = "=0.1.6"
epub = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "net", "io-util", "time"] }
futures = "0.3"
rmcp = { version = "3.1", features = ["server", "transport-io", "elicitation"] }
schemars = "1"
# Codex MCP config lives in ~/.codex/config.toml; toml_edit preserves
# user-authored comments + formatting on round-trip writes (unlike the
# plain `toml` crate).
toml_edit = "0.22"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
ulid = { version = "1", features = ["serde"] }
notify = "6"
gethostname = "0.5"
pdfium-render = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
chardetng = "0.1"
# The upstream FSRS crate, not the `rs-fsrs` port we ran until now. Two
# reasons: it is the implementation the algorithm's authors ship, and it is the
# only one carrying `ComputeParametersInput` — the optimizer that turns
# `vocab_review_log` into parameters fitted to this reader. Its scheduler is
# long-term only (`next_states` returns a fractional day interval, no due date
# and no learning steps), so the sub-day step lives in `commands/vocab.rs`.
# The training half pulls ndarray + rayon; `burn` stays dev-only.
fsrs = "6.6.1"
pulldown-cmark = "0.13"
ammonia = "4"
scraper = "0.24"
csv = "1"
fs2 = "0.4"
ttf-parser = "0.25"
wuff = "0.2.7"
# Edge Read aloud speech. Default features would pull a second blocking HTTP
# stack (`ureq`) we have no use for, so only the tokio runtime is enabled.
msedge-tts = { version = "0.4.0", default-features = false, features = ["tokio-runtime"] }
whatlang = "0.18"
# Toneless syllables are the only thing the alias pronunciation fallback in
# ai/grounding/aliases.rs ever compares, so the tone tables and the heteronym
# phrase database stay out of the binary: `plain` alone costs 226 KB / 82 KB
# compressed against 540 KB / 129 KB for the default feature set.
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
# Was dev-only until the atomic-write sites moved onto it. What it buys over a
# hand-rolled `.{uuid}.partial` name is not the name: it is that the temp file
# is removed when the guard drops, including on the `?` early returns where a
# manual `fs::remove_file` is easiest to forget. That omission is what
# 0c34177 had to fix in the font importer.
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The OCR runtime ships as `.tar.zst`. The system tar on macOS and Windows is a
# libarchive build without zstd linked in, and decodes `.zst` only by running a
# `zstd` binary that a packaged app's PATH does not have — so the archive is
# both decoded and unpacked in-process (commands/ocr/package.rs), with no
# external binary in the path. Desktop-only: the OCR write half is not compiled
# for mobile.
#
# The updater lives here for a different reason: it has no mobile
# implementation at all, and an unconditional dependency breaks the iOS build.
# `process` is what `relaunch()` after a finished download goes through.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
zstd = "0.13"
tar = "0.4"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-process = "=2.3.1"

# These back the iCloud Drive integration in icloud.rs and the coordinated
# append in sync/log.rs. Widened from `target_os = "macos"` to the whole Apple
# vendor in P5 (docs/roadmap/mobile-ios.md): iOS needs the same Foundation
# calls, and the gates in those two files moved in step with this table. Windows
# and Linux still get the stub halves.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSFileCoordinator", "NSString", "NSURL", "NSError", "NSNotification", "NSOperation", "NSValue", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Not used directly. It arrives through msedge-tts, which enables reqwest's
# default TLS, and on Windows x86-64 it refuses to build unless NASM is on the
# machine — which neither the release runner nor a contributor's checkout can be
# counted on to have. The feature makes it use its own pregenerated objects
# instead. Keep the version in step with whatever Cargo.lock resolves, or the
# graph ends up with two copies.
aws-lc-sys = { version = "0.43", features = ["prebuilt-nasm"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
lopdf = "0.42.0"
tauri = { version = "=2.11.5", features = ["test"] }

[profile.release]
# Until this existed, every release shipped its debug info: 9.1 MB of the
# 48.7 MB binary, in a bundle users download over the network. `debuginfo`
# rather than `symbols` on purpose -- it drops the DWARF and keeps the symbol
# table, so a panic in the wild still names the functions it came through.
strip = "debuginfo"
