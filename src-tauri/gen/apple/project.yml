name: lantern
options:
  bundleIdPrefix: com.klaragraff.lantern
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Lantern
      PRODUCT_BUNDLE_IDENTIFIER: com.klaragraff.lantern
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  lantern_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # The Rust staticlib is linked via `dependencies: framework: libapp.a`
      # plus LIBRARY_SEARCH_PATHS below — it must never be a build-phase
      # member, or xcodegen lists whatever .a files exist at generation time
      # as bundle Resources and the app ships a copy of its own object code
      # (a ~1GB debug lib inside the .ipa, until this bit).
      - path: Externals
        buildPhase: none
      - path: lantern_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: lantern_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: TaoSceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 2.18.15
        CFBundleVersion: "2.18.15"
        CFBundleDocumentTypes:
          - CFBundleTypeName: epub
            CFBundleTypeExtensions: [epub]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: pdf
            CFBundleTypeExtensions: [pdf]
            LSItemContentTypes: [com.adobe.pdf]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: txt
            CFBundleTypeExtensions: [txt]
            LSItemContentTypes: [public.plain-text]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: md
            CFBundleTypeExtensions: [md, markdown]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: html
            CFBundleTypeExtensions: [html, htm]
            LSItemContentTypes: [public.html]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: mobi
            CFBundleTypeExtensions: [mobi, azw, azw3]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: fb2
            CFBundleTypeExtensions: [fb2, fbz]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
          - CFBundleTypeName: cbz
            CFBundleTypeExtensions: [cbz]
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.gribuser.fb2
            UTTypeDescription: FictionBook Ebook
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.mime-type: [application/x-fictionbook+xml]
              public.filename-extension: [fb2]
          - UTTypeIdentifier: org.gribuser.fb2.zip
            UTTypeDescription: Compressed FictionBook Ebook
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.mime-type: [application/x-zip-compressed-fb2]
              public.filename-extension: [fbz]
          - UTTypeIdentifier: com.klaragraff.lantern.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.mime-type: [application/vnd.comicbook+zip]
              public.filename-extension: [cbz]
    entitlements:
      path: lantern_iOS/lantern_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      # `icloud::cellular`'s reachability probe (D-016). The `#[link]` attribute
      # on its `extern "C"` block does not carry: the Rust half builds as a
      # staticlib and Xcode drives the final link, so a framework named only in
      # Rust is a link error here and nowhere else — `cargo check` and `clippy`
      # never link, which is why this went unnoticed until the first real
      # iOS build.
      - sdk: SystemConfiguration.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: npm run -- tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
